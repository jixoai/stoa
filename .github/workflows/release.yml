name: Release

# npm 可信发布（OIDC trusted publishing）：
# - 打 v* tag 触发；不使用任何长期 npm token（无 NPM_TOKEN / NODE_AUTH_TOKEN）。
# - 绿门失败即不发布（fail-closed）。同版本重复发布由 registry 拒绝（预期）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gates — lint/check
        run: bun run check

      - name: Gates — typecheck
        run: bun run typecheck

      - name: Build (dist/ ships in the package and export tests need it)
        run: bun run build

      - name: Gates — tests
        run: bun test

      - name: Publish to npm (trusted publishing, provenance)
        run: npm publish --provenance --access public
